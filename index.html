<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doku & Draad — Coming Soon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero">
    <div class="hero__overlay"></div>

    <section class="notify">
      <h2 class="notify__title">Be the first to know</h2>
      <p class="notify__subtitle">Leave your email and we'll let you know the moment we launch.</p>
      <form class="notify__form" id="notify-form">
        <input type="email" name="email" placeholder="you@example.com" required aria-label="Email address">
        <button type="submit">Notify me</button>
      </form>
      <p class="notify__message" id="notify-message" hidden></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
